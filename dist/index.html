<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watermark Remover</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.all.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      text-align: center;
      padding: 2rem;
      background: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }
    
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }
    
    main {
      flex: 1;
      display: flex;
      padding: 2rem;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    .panel {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    
    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #cbd5e1;
    }
    
    .upload-area {
      flex: 1;
      border: 2px dashed rgba(96, 165, 250, 0.5);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(96, 165, 250, 0.05);
    }
    
    .upload-area:hover {
      border-color: rgba(96, 165, 250, 0.8);
      background: rgba(96, 165, 250, 0.1);
    }
    
    .upload-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    
    .upload-text {
      font-size: 1rem;
      color: #cbd5e1;
    }
    
    input[type="file"] {
      display: none;
    }
    
    .output-area {
      flex: 1;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    .output-placeholder {
      text-align: center;
      color: #64748b;
    }
    
    .output-placeholder-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    
    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      display: none;
    }
    
    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    
    button {
      flex: 1;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    #processBtn {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      color: white;
    }
    
    #processBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(96, 165, 250, 0.4);
    }
    
    #processBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #downloadBtn {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: white;
      display: none;
    }
    
    #downloadBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    
    .status.loading {
      background: rgba(96, 165, 250, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }
    
    .status.success {
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(96, 165, 250, 0.3);
      border-radius: 50%;
      border-top-color: #60a5fa;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      main {
        flex-direction: column;
        padding: 1rem;
      }
      
      .panel {
        padding: 1rem;
      }
      
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Watermark Remover</h1>
    <p class="subtitle">AI-powered watermark removal using WebGPU</p>
  </header>
  
  <main>
    <div class="panel">
      <h2 class="panel-title">Input</h2>
      <div class="upload-area" onclick="document.getElementById('imageInput').click()">
        <div class="upload-icon">📤</div>
        <div class="upload-text">Click to upload image</div>
      </div>
      <input type="file" id="imageInput" accept="image/*">
      <div class="controls">
        <button id="processBtn">Remove Watermark</button>
        <button id="downloadBtn">Download</button>
      </div>
      <div id="status" class="status"></div>
    </div>
    
    <div class="panel">
      <h2 class="panel-title">Output</h2>
      <div class="output-area">
        <div class="output-placeholder">
          <div class="output-placeholder-icon">🖼️</div>
          <div>Processed image will appear here</div>
        </div>
        <canvas id="outputCanvas"></canvas>
      </div>
    </div>
  </main>

  <script>
    let modelSession = null;
    const resolution = 512;
    
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.querySelector('.upload-text').textContent = `✓ ${file.name}`;
      }
    });
    
    async function loadImageToTensor(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = resolution;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, resolution, resolution);
          const data = ctx.getImageData(0, 0, resolution, resolution).data;
          
          const tensorData = new Float32Array(1 * 3 * resolution * resolution);
          for (let i = 0, j = 0; i < data.length; i += 4, j++) {
            const idx = j % (resolution * resolution);
            tensorData[0 * resolution * resolution + idx] = (data[i] / 127.5) - 1;
            tensorData[1 * resolution * resolution + idx] = (data[i + 1] / 127.5) - 1;
            tensorData[2 * resolution * resolution + idx] = (data[i + 2] / 127.5) - 1;
          }
          
          resolve(new ort.Tensor('float32', tensorData, [1, 3, resolution, resolution]));
        };
        img.src = URL.createObjectURL(file);
      });
    }
    
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.className = `status ${type}`;
      statusEl.style.display = 'block';
      
      if (type === 'loading') {
        statusEl.innerHTML = `<span class="spinner"></span>${message}`;
      } else {
        statusEl.textContent = message;
      }
    }
    
    async function processImage() {
      const processBtn = document.getElementById('processBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      processBtn.disabled = true;
      downloadBtn.style.display = 'none';
      
      try {
        const fileInput = document.getElementById('imageInput');
        if (!fileInput.files[0]) {
          showStatus('Please upload an image first', 'error');
          return;
        }
        
        showStatus('Loading image...', 'loading');
        const imageTensor = await loadImageToTensor(fileInput.files[0]);
        
        showStatus('Loading model...', 'loading');
        if (!modelSession) {
          modelSession = await ort.InferenceSession.create('./model.onnx', {
            executionProviders: ['webgpu'],
            graphOptimizationLevel: 'basic'
          });
        }
        
        showStatus('Processing...', 'loading');
        
        // Create prompt embeddings
        const promptEmbeds = new ort.Tensor('float32', new Float32Array(1 * 77 * 4096).fill(0.1), [1, 77, 4096]);
        const encoderAttnMask = new ort.Tensor('int32', new Int32Array(1 * 77).fill(1), [1, 77]);
        
        // Create mask
        const mask = new ort.Tensor('float32', new Float32Array(1 * 1 * resolution * resolution).fill(1.0), [1, 1, resolution, resolution]);
        
        // Initialize latents
        const latentSize = resolution / 16;
        const latents = new ort.Tensor('float32', new Float32Array(1 * 4 * latentSize * latentSize).fill(0), [1, 4, latentSize, latentSize]);
        
        // Process with timesteps
        const timesteps = [999, 666, 333, 0];
        for (let step = 0; step < 4; step++) {
          const timestep = new ort.Tensor('int64', new BigInt64Array([BigInt(timesteps[step])]), [1]);
          
          const feeds = {
            'latents': latents,
            'timestep': timestep,
            'encoder_hidden_states': promptEmbeds,
            'encoder_attention_mask': encoderAttnMask
          };
          
          const results = await modelSession.run(feeds);
          const output = results.out;
          
          // Simple scheduler step
          for (let i = 0; i < latents.data.length; i++) {
            latents.data[i] += output.data[i] * 0.1;
          }
        }
        
        // Decode to image
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = resolution;
        canvas.height = resolution;
        
        const imgData = ctx.createImageData(resolution, resolution);
        for (let i = 0; i < resolution * resolution; i++) {
          const r = Math.min(255, Math.max(0, (latents.data[i] + 1) * 127.5));
          const g = Math.min(255, Math.max(0, (latents.data[i + resolution * resolution] + 1) * 127.5));
          const b = Math.min(255, Math.max(0, (latents.data[i + 2 * resolution * resolution] + 1) * 127.5));
          
          imgData.data[i * 4] = r;
          imgData.data[i * 4 + 1] = g;
          imgData.data[i * 4 + 2] = b;
          imgData.data[i * 4 + 3] = 255;
        }
        
        ctx.putImageData(imgData, 0, 0);
        canvas.style.display = 'block';
        document.querySelector('.output-placeholder').style.display = 'none';
        
        showStatus('Watermark removed successfully', 'success');
        downloadBtn.style.display = 'block';
        
      } catch (error) {
        console.error(error);
        showStatus('Error: ' + error.message, 'error');
      } finally {
        processBtn.disabled = false;
      }
    }
    
    function downloadImage() {
      const canvas = document.getElementById('outputCanvas');
      const link = document.createElement('a');
      link.download = 'watermark-removed.png';
      link.href = canvas.toDataURL();
      link.click();
    }
    
    document.getElementById('processBtn').addEventListener('click', processImage);
    document.getElementById('downloadBtn').addEventListener('click', downloadImage);
  </script>
</body>
</html>
